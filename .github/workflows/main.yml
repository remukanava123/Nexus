name: Build

# Builds the Windows installer and the Linux packages (AppImage for Bazzite and any distro, rpm for Fedora).
# Run it by hand from the Actions tab, or push a tag like v1.1.0 to also attach them to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npx electron-builder --linux AppImage rpm tar.gz --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-linux
          path: |
            dist/*.AppImage
            dist/*.rpm
            dist/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-windows
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
