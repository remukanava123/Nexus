<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Badge unlocked</title>
<style>
  :root { --accent: #7c5cff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
  .wrap { position: absolute; inset: 0; padding: 6px; display: flex; align-items: center; }
  .card {
    position: relative; width: 100%; height: 100%; display: flex; align-items: center; gap: 14px; padding: 0 18px 0 14px; overflow: hidden;
    border-radius: 12px; color: #e9ecf5;
    background: linear-gradient(135deg, #20283a 0%, #151a27 60%, #12161f 100%);
    border: 1px solid rgba(255, 255, 255, .09);
    box-shadow: 0 10px 34px rgba(0, 0, 0, .55), 0 0 0 1px rgba(0, 0, 0, .4);
    transform: translateX(115%); opacity: 0;
    animation: slideIn .55s cubic-bezier(.2, .9, .25, 1) .05s forwards, slideOut .5s cubic-bezier(.6, 0, .8, .4) 6.1s forwards;
  }
  .card::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 0% 0%, color-mix(in srgb, var(--accent) 35%, transparent), transparent 60%); pointer-events: none; }
  .card::after { /* the shine that sweeps across once */
    content: ''; position: absolute; top: 0; bottom: 0; width: 70px; left: -90px; transform: skewX(-20deg);
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .22), transparent);
    animation: shine .9s ease-out .6s forwards;
  }
  .icon {
    position: relative; flex: none; width: 66px; height: 66px; border-radius: 10px; display: grid; place-items: center; font-size: 36px;
    background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 70%, #fff 10%), color-mix(in srgb, var(--accent) 35%, #000));
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25), 0 4px 14px rgba(0, 0, 0, .4);
    animation: pop .6s cubic-bezier(.3, 1.6, .5, 1) .45s both;
  }
  .text { position: relative; min-width: 0; }
  .head { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; color: color-mix(in srgb, var(--accent) 65%, #fff); }
  .name { margin-top: 3px; font-size: 17px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .desc { margin-top: 2px; font-size: 12.5px; line-height: 1.35; color: #aab2c5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .count { margin-top: 5px; font-size: 11px; color: #7e869a; }
  @keyframes slideIn { from { transform: translateX(115%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes slideOut { from { transform: none; opacity: 1; } to { transform: translateX(115%); opacity: 0; } }
  @keyframes shine { from { left: -90px; } to { left: 120%; } }
  @keyframes pop { from { transform: scale(.4) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="icon" id="icon"></div>
    <div class="text">
      <div class="head">★ Badge unlocked</div>
      <div class="name" id="name"></div>
      <div class="desc" id="desc"></div>
      <div class="count" id="count"></div>
    </div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const set = (id, v) => { document.getElementById(id).textContent = v; };
  if (q.get('accent')) document.documentElement.style.setProperty('--accent', q.get('accent'));
  set('icon', q.get('icon') || '🏆');
  set('name', q.get('name') || '');
  set('desc', q.get('desc') || '');
  set('count', `${q.get('n')} of ${q.get('total')} advancements unlocked`);

  // A short achievement chime: a rising arpeggio with a soft echo, made from plain oscillators
  const volume = Math.max(0, Math.min(100, Number(q.get('vol')) || 0)) / 100;
  if (volume > 0) {
    try {
      const ctx = new AudioContext();
      ctx.resume();
      const master = ctx.createGain();
      master.gain.value = 0.32 * volume;
      const echo = ctx.createDelay(); echo.delayTime.value = 0.17;
      const fb = ctx.createGain(); fb.gain.value = 0.32;
      const wet = ctx.createGain(); wet.gain.value = 0.4;
      echo.connect(fb); fb.connect(echo); echo.connect(wet); wet.connect(ctx.destination);
      master.connect(ctx.destination); master.connect(echo);
      const note = (freq, at, dur, type = 'sine', peak = 1) => {
        const o = ctx.createOscillator(), g = ctx.createGain(), t0 = ctx.currentTime + at;
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(master);
        o.start(t0); o.stop(t0 + dur + 0.05);
      };
      // A5 - C#6 - E6 - A6, with a faint octave of the top note for sparkle
      [[880, 0], [1108.7, 0.085], [1318.5, 0.17]].forEach(([f, t]) => { note(f, t, 0.5, 'sine', 0.8); note(f * 2, t, 0.22, 'triangle', 0.12); });
      note(1760, 0.255, 1.1, 'sine', 0.9); note(3520, 0.255, 0.5, 'triangle', 0.1);
      note(440, 0.0, 0.9, 'sine', 0.35); // warm low note underneath
    } catch (e) { /* no audio available: silent popup */ }
  }
</script>
</body>
</html>
