<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Nexus</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="boot" class="boot"><div class="boot-inner"><svg class="boot-logo" viewBox="0 0 256 256" aria-hidden="true">
    <defs>
      <linearGradient id="bt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a63ff"/><stop offset=".55" stop-color="#5b7cff"/><stop offset="1" stop-color="#2fb6ff"/></linearGradient>
      <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <linearGradient id="bn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dfe6ff"/></linearGradient>
      <linearGradient id="bc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a55ff"/><stop offset="1" stop-color="#3d8bff"/></linearGradient>
      <clipPath id="bclip"><rect x="8" y="8" width="240" height="240" rx="60"/></clipPath>
      <filter id="bglow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    </defs>
    <g class="bl-tile">
      <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#bt)"/>
      <rect x="26" y="26" width="204" height="204" rx="44" fill="#0b0d22" fill-opacity=".30" stroke="#fff" stroke-opacity=".20" stroke-width="1.5"/>
      <g clip-path="url(#bclip)"><rect x="8" y="8" width="240" height="118" fill="url(#bg)"/></g>
    </g>
    <g transform="rotate(-24 128 128)" fill="none" class="bl-orbit">
      <ellipse cx="128" cy="128" rx="96" ry="36" stroke="#fff" stroke-opacity=".30" stroke-width="2.5"/>
      <circle r="8" fill="#fff"><animateMotion dur="5s" repeatCount="indefinite" path="M 224 128 A 96 36 0 1 1 32 128 A 96 36 0 1 1 224 128"/></circle>
      <circle r="4.5" fill="#fff" fill-opacity=".7"><animateMotion dur="5s" begin="-2.5s" repeatCount="indefinite" path="M 224 128 A 96 36 0 1 1 32 128 A 96 36 0 1 1 224 128"/></circle>
    </g>
    <path class="bl-glow" d="M82 176V80l92 96V80" fill="none" stroke="#bcd0ff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#bglow)"/>
    <path class="bl-n" d="M82 176V80l92 96V80" fill="none" stroke="url(#bn)" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" pathLength="100"/>
    <g class="bl-nodes">
      <g style="--d:.35s"><circle cx="82" cy="176" r="15" fill="#fff"/><circle cx="82" cy="176" r="6.5" fill="url(#bc)"/></g>
      <g style="--d:.6s"><circle cx="82" cy="80" r="15" fill="#fff"/><circle cx="82" cy="80" r="6.5" fill="url(#bc)"/></g>
      <g style="--d:.85s"><circle cx="174" cy="176" r="15" fill="#fff"/><circle cx="174" cy="176" r="6.5" fill="url(#bc)"/></g>
      <g style="--d:1.1s"><circle cx="174" cy="80" r="15" fill="#fff"/><circle cx="174" cy="80" r="6.5" fill="url(#bc)"/></g>
    </g>
  </svg><div class="boot-name">NEXUS</div><div class="boot-bar"><i></i></div></div></div>
  <div class="titlebar"><span class="brand"><img class="logo" src="../assets/logo.svg" alt="">Nexus</span></div>

  <aside class="sidebar">
    <nav id="nav">
      <button data-view="home" class="active"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/><rect x="15.6" y="3.6" width="3" height="6" rx=".7"/><g class="smoke"><circle class="s1" cx="17.1" cy="2.4" r="1.8"/><circle class="s2" cx="17.1" cy="2.4" r="1.5"/><circle class="s3" cx="17.1" cy="2.4" r="1.9"/></g></svg>Home</button>
      <button data-view="games"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M6.5 7h11A4.5 4.5 0 0 1 22 11.6l-.6 4.4a2.6 2.6 0 0 1-4.4 1.5L15 15.2H9L7 17.5A2.6 2.6 0 0 1 2.6 16L2 11.6A4.5 4.5 0 0 1 6.5 7zM7 9.4h1v1.7h1.7v1H8v1.7H7v-1.7H5.3v-1H7zm8.5.2a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zm2.5 2a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2z"/><circle class="gb1" cx="15.5" cy="10.7" r="1.1"/><circle class="gb2" cx="18" cy="12.7" r="1.1"/></svg>Games<span class="count" data-count="game"></span></button>
      <button data-view="apps"><svg viewBox="0 0 24 24"><rect class="t t1" x="4" y="4" width="7" height="7" rx="1.3"/><rect class="t t2" x="13" y="4" width="7" height="7" rx="1.3"/><rect class="t t3" x="4" y="13" width="7" height="7" rx="1.3"/><rect class="t t4" x="13" y="13" width="7" height="7" rx="1.3"/></svg>Apps<span class="count" data-count="app"></span></button>
      <button data-view="web"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-3a15 15 0 0 0-1.3-3.9A8 8 0 0 1 18.9 8zM12 4c.8 1.1 1.6 2.4 2 4h-4c.4-1.6 1.2-2.9 2-4zM4.3 14a8 8 0 0 1 0-4h3.4a16 16 0 0 0 0 4zm.8 2h3a15 15 0 0 0 1.3 3.9A8 8 0 0 1 5.1 16zm3-8h-3a8 8 0 0 1 4.3-3.9C8.8 5.3 8.4 6.6 8.1 8zM12 20c-.8-1.1-1.6-2.4-2-4h4c-.4 1.6-1.2 2.9-2 4zm2.3-6H9.7a14 14 0 0 1 0-4h4.6a14 14 0 0 1 0 4zm.3 5.9c.6-1.2 1-2.5 1.3-3.9h3a8 8 0 0 1-4.3 3.9zM16.3 14a16 16 0 0 0 0-4h3.4a8 8 0 0 1 0 4z"/><circle class="ring r1" cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.2"/><circle class="ring r2" cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>Websites<span class="count" data-count="web"></span></button>
      <button data-view="favorites"><svg viewBox="0 0 24 24"><path class="st" d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2-5.5-2.9-5.5 2.9 1-6.2L3 9.6l6.2-.9z"/><g transform="translate(21 4) scale(1.45)"><path class="sp sp1" d="M0-2.6.7-.7 2.6 0 .7.7 0 2.6-.7.7-2.6 0-.7-.7z"/></g><g transform="translate(3 5) scale(1.45)"><path class="sp sp2" d="M0-2.6.7-.7 2.6 0 .7.7 0 2.6-.7.7-2.6 0-.7-.7z"/></g><g transform="translate(20.5 21) scale(1.45)"><path class="sp sp3" d="M0-2.6.7-.7 2.6 0 .7.7 0 2.6-.7.7-2.6 0-.7-.7z"/></g><g transform="translate(4 20.5) scale(1.45)"><path class="sp sp4" d="M0-2.6.7-.7 2.6 0 .7.7 0 2.6-.7.7-2.6 0-.7-.7z"/></g></svg>Favourites</button>
      <div class="nav-sep"></div>
      <button data-view="stats"><svg viewBox="0 0 24 24"><path class="bar sb1" d="M4 20v-7h3.5v7z"/><path class="bar sb2" d="M10.25 20v-9h3.5v9z"/><path class="bar sb3" d="M16.5 20v-5H20v5z"/><polyline class="trend" points="3.5,10 9,6.6 13,8.6 20,3" pathLength="100" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path class="arrow" d="M16.6 2.8h3.8v3.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>Stats</button>
      <div class="nav-sep"></div>
      <button data-view="barca"><svg viewBox="0 0 24 24"><g class="net"><path d="M15 4h8v16h-8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15 8h8M15 12h8M15 16h8M17.7 4v16M20.4 4v16" fill="none" stroke="currentColor" stroke-width=".7" opacity=".75"/></g><g class="lines" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M0.5 9h4M0 12h4.5M0.5 15h4"/></g><g class="ball"><circle cx="9" cy="12" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 9.5l2.3 1.7-.9 2.7H7.6l-.9-2.7z"/><path d="M9 9.5V7.8M11.3 11.2l1.6-.5M10.4 13.9l1-1.4M7.6 13.9l-1-1.4M6.7 11.2l-1.6-.5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></g></svg>Barça</button>
      <button data-view="news"><svg viewBox="0 0 24 24"><path d="M4 5h13a1 1 0 0 1 1 1v12.5a1.5 1.5 0 0 0 3 0V9h-2V7h3a1 1 0 0 1 1 1v10.5a3.5 3.5 0 0 1-3.5 3.5H6a3 3 0 0 1-3-3V6a1 1 0 0 1 1-1zm2 3v2h9V8zm0 4v2h9v-2zm0 4v2h6v-2z"/></svg>News<i class="nav-dot" id="newsDot" hidden></i></button>
      <button data-view="overwatch" hidden><svg viewBox="0 0 448 448"><g class="ow-body"><path d="M358.8 45.1A224 224 0 1 1 89.2 45.1L128.3 97.0A159 159 0 1 0 319.7 97.0Z"/><path d="M214 125L174 218L86 298L125 345L214 298Z"/><path d="M234 125L274 218L362 298L323 345L234 298Z"/></g><path class="ow-arc" d="M106.4 42.8A216 216 0 0 1 341.6 42.8L311.7 89.0A161 161 0 0 0 136.3 89.0Z"/></svg>Overwatch</button>
      <button data-view="gacha" hidden><svg viewBox="0 0 24 24"><path d="m12 2 2.3 6.2L21 10.5l-6.7 2.3L12 19l-2.3-6.2L3 10.5l6.7-2.3zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>Gacha</button>
    </nav>
    <div id="nowStatus" class="now-status"></div>
    <div class="sidebar-bottom">
      <button id="pickBtn" title="Spin the wheel (Ctrl+R)"><svg viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm3 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm8 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-4 3.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM8 14a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm8 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>Pick a game</button>
      <button id="bigBtn" title="Fullscreen couch mode (F11)"><svg viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-7v2h3v2H7v-2h3v-2H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2v9h16V7z"/></svg>Big screen</button>
      <button id="desktopBtn" hidden title="Switch to the Windows desktop (taskbar and Start menu)"><svg viewBox="0 0 24 24"><path d="M3 4h18a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-7l1 3h2v2H8v-2h2l1-3H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 2v9h16V6z"/></svg>Windows desktop</button>
      <button id="addBtn"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>Add</button>
      <button data-view="settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L15 3.5h-4L10.7 6a7 7 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>Settings</button>
    </div>
  </aside>

  <main>
    <div class="page-bg" id="pageBg"></div>
    <header class="topbar">
      <div class="search">
        <svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
        <input id="search" placeholder="Search games, apps and websites…" autocomplete="off" spellcheck="false">
        <kbd id="hotkeyHint"></kbd>
      </div>
    </header>
    <section id="content" class="content"><div class="loading"><div class="spinner"></div>Scanning your library…</div></section>
  </main>

  <div id="detail" class="detail" hidden></div>
  <div id="picker" class="picker" hidden></div>
  <div id="big" class="big" tabindex="-1" hidden></div>
  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-nav prev" data-dir="-1">‹</button>
    <img id="lbImg" alt="">
    <button class="lb-nav next" data-dir="1">›</button>
    <div id="lbCount" class="lb-count"></div>
  </div>
  <div id="menu" class="menu" hidden></div>
  <div id="modal" class="modal-backdrop" hidden><div class="modal" id="modalBody"></div></div>
  <div id="toast" class="toast"></div>
  <canvas id="fx" class="fx"></canvas>

  <div id="onboard" class="onboard" hidden></div>
  <script src="../shared/gacha-data.js"></script>
  <script src="js/util.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/tips.js"></script>
  <script src="js/tips-more.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/lifetime-ui.js"></script>
  <script src="js/advancements.js"></script>
  <script src="js/tags.js"></script>
  <script src="js/barca.js"></script>
  <script src="js/news.js"></script>
  <script src="../shared/ow-data.js"></script>
  <script src="js/gacha-ui.js"></script>
  <script src="js/ow-ui.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/picker.js"></script>
  <script src="js/bigscreen.js"></script>
  <script src="js/settings-ui.js"></script>
  <script src="js/onboarding.js"></script>
  <script src="js/fx-v6.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
